version: "3.9"

services:
  mongo_db:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  database:
    build: ./database
    container_name: dealers_reviews_service
    depends_on:
      - mongo_db
    environment:
      - MONGO_URL=mongodb://mongo_db:27017/dealershipsDB
    ports:
      - "3030:3030"

  sentiment_analyzer:
    build: ./sentiment_analyzer
    container_name: sentiment_analyzer
    ports:
      - "5050:5050"

  server:
    build: ./server
    container_name: django_server
    depends_on:
      - database
      - sentiment_analyzer
    environment:
      - BACKEND_URL=http://dealers_reviews_service:3030
      - SENTIMENT_ANALYZER_URL=http://sentiment_analyzer:5050
      - DJANGO_DEBUG=True
    ports:
      - "8000:8000"

volumes:
  mongo_data:
